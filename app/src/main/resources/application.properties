# =============================================================================
# Apitomy Axiom - Application Configuration
# =============================================================================

# --- HTTP ---
quarkus.http.port=9090
%prod.quarkus.http.port=9191
# Axiom has no authentication: the release build listens on this machine only. To accept connections from
# other machines, set quarkus.http.host (e.g. QUARKUS_HTTP_HOST=0.0.0.0) and protect access yourself.
%prod.quarkus.http.host=127.0.0.1
# No CORS: the UI is served from the same origin, so other web sites cannot call the API from a browser.

# --- Database (default: H2 in-memory for dev and test) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:axiom;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
# Statistics let tests guard against N+1 queries (LineageTest)
%test.quarkus.hibernate-orm.statistics=true

# --- Database (persist profile + prod: H2 file-based, survives restarts) ---
# Activate with: -Dquarkus.profile=persist  or  QUARKUS_PROFILE=persist
# Production mode uses the same file-based H2 database automatically.
# axiom.data-url is <axiom.home>/data/axiom as an absolute path (AxiomDataUrlConfigSourceFactory).
%persist.quarkus.datasource.jdbc.url=${axiom.data-url}
%persist.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.datasource.jdbc.url=${axiom.data-url}
%prod.quarkus.hibernate-orm.database.generation=none

# --- Flyway (schema migration for persistent databases) ---
quarkus.flyway.migrate-at-start=false
%persist.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.migrate-at-start=true
# No baselining: a database from Axiom 2.x or older is refused at startup (LegacyDatabaseGuard).

# --- GitHub Integration ---
# Polling interval for GitHub API (default: 60 seconds)
# GitHub token is now managed via Configuration > Secrets (GH_TOKEN)

# --- Agent ---
# Default agent type: "claude-code", "opencode", or "copilot"
axiom.agent.default-type=claude-code

# --- Helper Services ---
# Engine override for AI helper services (prompt editor, script editor, tool editor)
# Defaults to the global default agent if not set.
# axiom.helper-services.engine=claude-code
# Model override for AI helper services (optional)
# axiom.helper-services.model=claude-sonnet-4-6

# --- Claude Code Agent ---
# Path to the claude CLI executable (defaults to "claude" on PATH)
# axiom.agent.claude-code.executable=/usr/local/bin/claude
# Plugin paths passed to the CLI as repeated --plugin-dir flags
# (comma-separated absolute paths; needed to load skills under --bare)
# axiom.agent.claude-code.plugin-dirs=/opt/axiom/plugins/cve-finder
# Model to use (optional, defaults to Claude Code's default)
# axiom.agent.claude-code.model=claude-sonnet-4-6
# Available models for the UI model picker (comma-separated)
axiom.agent.claude-code.available-models=claude-opus-4-7,claude-sonnet-4-6,claude-opus-4-6,claude-haiku-4-5-20251001,opus,sonnet,haiku
# Maximum agentic turns per task
axiom.agent.claude-code.max-steps=50
# Maximum cost per task in USD
axiom.agent.claude-code.max-budget-usd=5.0
# Subprocess timeout in seconds
axiom.agent.claude-code.timeout-seconds=600

# --- OpenCode Agent ---
# Path to the opencode CLI executable (defaults to "opencode" on PATH)
axiom.agent.opencode.executable=opencode
# Server hostname and port for `opencode serve`
axiom.agent.opencode.server.hostname=127.0.0.1
axiom.agent.opencode.server.port=4096
# Model in provider/model format (e.g. anthropic/claude-sonnet-4-6)
axiom.agent.opencode.model=github-copilot/claude-sonnet-5
# Available models for the UI model picker (comma-separated, provider/model format)
axiom.agent.opencode.available-models=github-copilot/kimi-k3,github-copilot/claude-sonnet-5
# Maximum agent steps per task
axiom.agent.opencode.max-steps=50
# HTTP request timeout in seconds
axiom.agent.opencode.timeout-seconds=600

# --- Copilot Agent ---
# Path to the copilot CLI executable (defaults to "copilot" on PATH)
# axiom.agent.copilot.executable=/usr/local/bin/copilot
# Model to use (optional, defaults to Copilot CLI's default/auto selection)
# axiom.agent.copilot.model=claude-sonnet-5
# Available models for the UI model picker (comma-separated)
axiom.agent.copilot.available-models=claude-sonnet-5,claude-opus-5,claude-haiku-4.5,gpt-5.4,gpt-5-mini,auto
# Subprocess timeout in seconds
axiom.agent.copilot.timeout-seconds=600

# --- AI Assistant ---
# Maximum concurrent interactive assistant sessions
axiom.assistant.max-sessions=12
# Path to the OpenCode CLI executable for interactive assistant sessions
axiom.assistant.opencode.executable=opencode
# OpenCode interactive runtime startup timeout in seconds
axiom.assistant.opencode.startup-timeout-seconds=30

# --- Event stream pipeline ---
# How often new stream events are routed and failed ledger entries retried (default 5s)
#axiom.stream-pipeline.poll-interval=5s
# Maximum routing attempts (first try + retries) for an (event, subscription) ledger entry.
# An entry whose last allowed attempt fails becomes "exhausted" and is no longer retried
# automatically (it can be retried manually from the event detail page or the API).
axiom.stream-pipeline.max-attempts=3
# Exponential backoff between attempts: the delay after failed attempt n is
# min(retry-initial-delay * 2^(n-1), retry-max-delay)
axiom.stream-pipeline.retry-initial-delay=30s
axiom.stream-pipeline.retry-max-delay=1h

# --- Workspaces ---
# Root directory for subject git clones
# Axiom home: sessions, task files, installed MCP servers, workspaces and the encryption key.
# Test runs override it (Surefire system property) so they never touch a developer's ~/.axiom.
axiom.home=${user.home}/.axiom
axiom.workspace.root=${axiom.home}/workspaces

# --- Test profile: disable all background pollers ---
%test.axiom.task-queue.poll-interval=off
%test.axiom.workflow.wait-poll-interval=off
%test.axiom.workflow.schedule-poll-interval=off
%test.axiom.stream-pipeline.poll-interval=off

# --- Logging ---
# %X{axiomCtx} renders the correlation IDs present in the logging MDC (traceId, eventId, subjectId,
# taskId, workflowRunId) as "[traceId=... taskId=42] ", and nothing when none are set.
# It is maintained by io.apitomy.axiom.core.logging.LogContext. See docs/developer-guide/correlation.md.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %X{axiomCtx}%s%e%n
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %h %N[%i] %-5p [%c{3.}] (%t) %X{axiomCtx}%s%e%n
quarkus.log.level=INFO
quarkus.log.category."io.apitomy.axiom".level=DEBUG
