name: Publish Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'

    steps:
      - name: Checkout apitomy-axiom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15.1'

      - name: Install MkDocs and dependencies
        run: |
          # MkDocs 2.0 drops the plugin and theme system Material for MkDocs relies on.
          pip install "mkdocs>=1.5.0,<2"
          pip install "mkdocs-material>=9.0.0,<10"
          pip install pymdown-extensions

      - name: Build documentation
        run: mkdocs build --strict

      - name: Checkout website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Apitomy/apitomy.github.io
          token: ${{ secrets.ACCESS_TOKEN }}
          path: website

      - name: Copy generated docs to website
        run: |
          rm -rf website/projects/axiom/docs
          mkdir -p website/projects/axiom
          cp -r site website/projects/axiom/docs

      - name: Commit and push to website
        run: |
          cd website
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git add projects/axiom/docs
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Axiom documentation (automated)"
            git push
          fi
