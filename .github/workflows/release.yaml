name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release Apitomy Axiom
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    timeout-minutes: 30

    steps:
      # ── Setup ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: oracle
          java-version: '25'

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'

      - name: Configure Git
        run: |
          git config --global user.name "apitomy-ci"
          git config --global user.email "apitomy.ci@gmail.com"

      # ── Determine release version from pom.xml ───────────────────────
      - name: Determine release version
        id: version
        run: |
          SNAPSHOT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          RELEASE_VERSION="${SNAPSHOT_VERSION%-SNAPSHOT}"
          echo "release-version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${RELEASE_VERSION}"

      # ── Set release version ──────────────────────────────────────────
      - name: Set release version
        run: scripts/set-version.sh ${{ steps.version.outputs.release-version }}

      # ── Release notes: docs/release-notes/v<version>.md when present, otherwise generated notes ──
      - name: Find release notes
        id: notes
        run: |
          NOTES="docs/release-notes/v${{ steps.version.outputs.release-version }}.md"
          if [[ -f "$NOTES" ]]; then
            echo "body-path=${NOTES}" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "Using release notes ${NOTES}"
          else
            echo "body-path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "No ${NOTES}; using generated release notes"
          fi

      # ── Build and test ───────────────────────────────────────────────
      - name: Build application with UI
        run: ./build-release.sh

      - name: Rename uber-jar for release
        run: |
          cp app/target/apitomy-axiom-app-${{ steps.version.outputs.release-version }}-runner.jar \
             app/target/apitomy-axiom-${{ steps.version.outputs.release-version }}.jar

      # ── Commit and tag locally; push only after every step that can fail has run ──
      - name: Commit and tag release
        run: |
          git add -A
          git commit -m "Release ${{ steps.version.outputs.release-version }}"
          git tag v${{ steps.version.outputs.release-version }}

      - name: Push release commit and tag
        run: |
          git push origin HEAD
          git push origin v${{ steps.version.outputs.release-version }}

      # ── Create the GitHub Release as a draft; a maintainer reviews and publishes it ──
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.version.outputs.release-version }}
          name: ${{ steps.version.outputs.release-version }}
          draft: true
          body_path: ${{ steps.notes.outputs.body-path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          prerelease: ${{ contains(steps.version.outputs.release-version, 'RC') || contains(steps.version.outputs.release-version, 'alpha') || contains(steps.version.outputs.release-version, 'beta') }}
          files: |
            app/target/apitomy-axiom-${{ steps.version.outputs.release-version }}.jar

      # ── Prepare next development version ─────────────────────────────
      - name: Compute next SNAPSHOT version
        id: next-version
        run: |
          RELEASE="${{ steps.version.outputs.release-version }}"
          MAJOR=$(echo "$RELEASE" | cut -d. -f1)
          MINOR=$(echo "$RELEASE" | cut -d. -f2)
          PATCH=$(echo "$RELEASE" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "next-version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next development version: ${NEXT_VERSION}"

      - name: Set next SNAPSHOT version
        run: scripts/set-version.sh ${{ steps.next-version.outputs.next-version }}

      - name: Commit and push SNAPSHOT version
        run: |
          git add -A
          git commit -m "Prepare next development version ${{ steps.next-version.outputs.next-version }}"
          git push origin HEAD

      # Slack: success to the general channel, failure to the important one,
      # mentioning whoever ran the release.
      - name: Notify
        if: ${{ !cancelled() }}
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ job.status == 'success' && 'general' || 'important' }}
          text: "${{ job.status == 'success' && format(':rocket: {0} {1}: draft release created, ready to publish', github.repository, steps.version.outputs.release-version) || format(':x: {0}: release {1} failed', github.repository, steps.version.outputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ job.status != 'success' && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
