site_name: Apitomy Axiom
site_description: Event-driven project orchestration platform
site_author: Apitomy
site_url: https://www.apitomy.io/projects/axiom/docs/

repo_name: Apitomy/apitomy-axiom
repo_url: https://github.com/Apitomy/apitomy-axiom
use_directory_urls: false

theme:
  name: material
  custom_dir: docs/theme
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - Running Axiom: getting-started/running-axiom.md
    - Configuring Axiom: getting-started/configuring-axiom.md
    - How to Contribute: getting-started/contributing.md
  - User Guide:
    - Concepts: user-guide/concepts.md
    - Navigating the UI: user-guide/navigating-the-ui.md
    - Usage Examples: user-guide/usage-examples.md
    - AI Assistant: user-guide/ai-assistant.md
    - Logging and Debugging: user-guide/logging-and-debugging.md
  - Developer Guide:
    - Stack & Architecture: developer-guide/stack-and-architecture.md
    - Building Axiom: developer-guide/building-axiom.md
    - How to Contribute: developer-guide/how-to-contribute.md
    - API-First Development: developer-guide/api-first-development.md
    - Database & Migrations: developer-guide/database-and-migrations.md
    - UI Development: developer-guide/ui-development.md
    - Extending Axiom: developer-guide/extending-axiom.md

docs_dir: ./docs
site_dir: ./site

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Apitomy/apitomy-axiom

extra_css:
  - theme/css/project-colors.css
  - theme/css/apitomy-base.css
